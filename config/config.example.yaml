# Secrets: write ${VAR}; values come from the environment or from a .env next to this file.
# A literal "$" must be written as "$$". Missing variables abort startup.
restic:
  # shared repo for jobs without their own restic block; each job's name is added as a tag to tell them apart
  repository: /restic            # any restic repo URL works (sftp:, s3:, rest:...); backend creds go in .env
  password: "${RESTIC_PASSWORD}"
# Root of the data, holding one directory per job (mirror + lock + last_ok). Setting it here beats BACKUP_ON_SIGHT_STATE_DIR.
# state_dir: ./state             # default: BACKUP_ON_SIGHT_STATE_DIR, else ./state (/state in the container)
poll_interval: 30s               # how often each job checks if a backup is due and probes its host
# webhook: https://hooks.lan/backups # optional, gets a JSON POST when a backup starts and ends

jobs:
  # PSP with the FTP server enabled. The probe comes from the source's host and port.
  psp:
    source:
      type: ftp                  # ftp uses lftp; any other type is an rclone backend, like sftp
      host: 192.168.1.50
      port: 1337                 # optional for ftp and sftp
      path: /ms0:/               # optional, the PSP's memory stick; default is /
      # user: me                 # ftp default: anonymous
      # password: "${PSP_FTP_PASS}"  # the plain password
      # options: {"net:connection-limit": 2}  # optional lftp settings (rclone backend options for other types)
      # exclude:                 # optional: absolute paths on the device, or globs; anything else is undefined
      #   - /ms0:/ISO            # this file or folder, with everything inside it
      #   - "*.tmp"              # matched by the sync tool, at any depth
    probe: {interval: 10s}       # optional, replaces poll_interval for this job
    every: 24h
    tags: [console, saves]       # optional, added to the app and job name tags on each snapshot
    # webhook: https://hooks.lan/psp  # optional, replaces the global webhook for this job; null disables it

  # A source can also be a raw rclone source string, which needs its own probe and an obscured password
  # (`rclone obscure <pass>`). This one is an always-on host, backed up weekly, in its own repository.
  nas-photos:
    restic:
      repository: "${NAS_RESTIC_REPOSITORY}"
      password: "${NAS_RESTIC_PASSWORD}"
    probe: {host: nas.lan, port: 22}
    source: ":sftp,host=nas.lan,user=backup,pass=${NAS_SFTP_PASS}:/srv/photos"
    every: 7d
    tags: [nas, photos]
