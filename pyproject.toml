[project]
name = "auto-network-backup"
version = "0.1.0"
description = "Back up network devices automatically when they show up, with rclone and restic"
readme = "README.md"
authors = [
    { name = "Luis López", email = "luis@cuarentaydos.com" }
]
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
anb = "auto_network_backup:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
