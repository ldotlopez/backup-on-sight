[project]
name = "hbw"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Luis López", email = "luis@cuarentaydos.com" }
]
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
hbw = "hbw:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
