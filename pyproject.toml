[project]
name = "backup-on-sight"
version = "0.1.0"
description = "Back up network devices automatically when they show up, with rclone and restic"
readme = "README.md"
authors = [
    { name = "Luis López", email = "luis@cuarentaydos.com" }
]
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
keywords = ["backup", "rclone", "restic", "network", "daemon", "ftp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/ldotlopez/backup-on-sight"
Repository = "https://github.com/ldotlopez/backup-on-sight"
Issues = "https://github.com/ldotlopez/backup-on-sight/issues"

[project.scripts]
bos = "backup_on_sight:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["backup_on_sight.py"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
