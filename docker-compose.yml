services:
  backup-on-sight:
    build: .
    container_name: backup-on-sight
    restart: unless-stopped
    init: true                   # forwards SIGTERM and reaps rclone/restic children
    network_mode: host           # probes must reach LAN hosts directly
    env_file: ./config/.env
    environment:
      BACKUP_ON_SIGHT_STATE_DIR: /state
    volumes:
      - ./config:/config:ro
      - ./data/state:/state
      - ./data/restic:/restic
# on demand: docker exec backup-on-sight bos run psp
